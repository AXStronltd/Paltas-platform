# Render blueprint for PALTAS.
#
# Two services: the Next.js app and the Postgres it depends on. Committing this
# means the deployment is described in the repository rather than in a dashboard
# somebody has to remember the state of.
#
# Secrets are deliberately NOT here. `sync: false` tells Render to prompt for the
# value and store it encrypted, so no key is ever committed. That is why
# STRIPE_SECRET_KEY has no `value:` line — a blueprint is a public document.

databases:
  - name: paltas-db
    databaseName: paltas
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: paltas
    runtime: node
    plan: free
    region: frankfurt
    branch: main

    # Migrations deliberately do NOT run here. The build step has no reliable
    # connection to the database — DATABASE_URL may be injected but the instance
    # is not yet attached to the network the database sits on, and `prisma
    # migrate deploy` then fails the whole build.
    buildCommand: npm ci && npx prisma generate && npm run build

    # They run at start instead, where the service is on the network and can
    # reach the database. `migrate deploy` only applies what is pending, so
    # running it on every boot is safe and idempotent.
    #
    # On a paid instance, `preDeployCommand: npx prisma migrate deploy` is
    # tidier — it runs once before the new version takes traffic, rather than on
    # each boot. It is not available on the free plan.
    startCommand: npx prisma migrate deploy && npm run start
    healthCheckPath: /api/public/listings

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paltas-db
          property: connectionString

      - key: NODE_VERSION
        value: "20"

      # The build peaks around 650 MB, measured. Capping the heap makes V8
      # collect rather than grow to fill whatever is available, which keeps it
      # inside a small instance — at the cost of a slower build.
      #
      # If the build still dies with "JavaScript heap out of memory", the
      # instance is genuinely too small and needs a plan with more RAM. No
      # amount of tuning compiles this in 512 MB.
      - key: NODE_OPTIONS
        value: "--max-old-space-size=1536"

      - key: NEXT_PUBLIC_DATA_SOURCE
        value: mock

      # ---- Secrets: entered in the Render dashboard, never committed --------
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      # Publishable key. Safe in the browser, but still set per-environment.
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false

      # Password for the seeded demo accounts. Set it, or seeding uses a default
      # that is fine locally and not fine on a public host.
      - key: SEED_PASSWORD
        sync: false
