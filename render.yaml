# Render blueprint for PALTAS.
#
# Two services: the Next.js app and the Postgres it depends on. Committing this
# means the deployment is described in the repository rather than in a dashboard
# somebody has to remember the state of.
#
# Secrets are deliberately NOT here. `sync: false` tells Render to prompt for the
# value and store it encrypted, so no key is ever committed. That is why
# STRIPE_SECRET_KEY has no `value:` line — a blueprint is a public document.

databases:
  - name: paltas-db
    databaseName: paltas
    # Not `free`: Render deletes a free database after 30 days, taking every
    # resident, charge and audit entry with it. This is the cheapest plan that
    # persists.
    plan: basic-256mb
    postgresMajorVersion: "16"
    # MUST match the web service's region. Render's internal connection string
    # only resolves within a single region — a service in Frankfurt cannot reach
    # a database in Oregon over the internal hostname, and the failure it
    # produces is exactly `P1001: Can't reach database server at dpg-…:5432`.
    #
    # Omitting this does not inherit the service's region; it silently falls
    # back to Render's default, which is how the two ended up apart.
    region: frankfurt

services:
  - type: web
    name: paltas-platform
    # `next build` peaks around 650 MB on this codebase, measured. Both `free`
    # and `starter` cap at 512 MB, so the build would be killed. `standard` has
    # 2 GB, which clears it with room to spare.
    plan: standard
    region: frankfurt

    # Render builds the Dockerfile itself. No registry is involved, so there is
    # no package to make public and no pull credential to configure — the two
    # things that blocked every previous attempt.
    #
    # The same Dockerfile is built and fully exercised in CI on every push
    # (.github/workflows/image.yml runs the container against a real Postgres
    # and passes all five e2e suites against it), so what Render builds here is
    # an artifact already proven to start, migrate and serve.
    #
    # The build is heavy — around 650 MB locally. Render's build machines are
    # provisioned separately from the instance, so the 512 MB instance limit
    # does not necessarily apply; if a build does fail on memory, the fix is a
    # larger instance, and the GHCR route in DEPLOY.md is the fallback.
    branch: main
    runtime: docker
    dockerfilePath: ./Dockerfile

    # No build or start command: the image carries both. Its CMD applies
    # pending migrations and then serves — see the Dockerfile.
    healthCheckPath: /api/public/listings

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paltas-db
          property: connectionString


      - key: NEXT_PUBLIC_DATA_SOURCE
        value: mock

      # ---- Secrets: entered in the Render dashboard, never committed --------
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      # Publishable key. Safe in the browser, but still set per-environment.
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false

      # Password for the seeded demo accounts. Set it, or seeding uses a default
      # that is fine locally and not fine on a public host.
      - key: SEED_PASSWORD
        sync: false
