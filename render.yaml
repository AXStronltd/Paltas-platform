# Render blueprint for PALTAS.
#
# Two services: the Next.js app and the Postgres it depends on. Committing this
# means the deployment is described in the repository rather than in a dashboard
# somebody has to remember the state of.
#
# Applying this blueprint asks the operator for nothing. That is deliberate:
# every prompt is a step a deployment can stall on, and this one stalled four
# times before it was made unattended.
#
# No secret is committed here — a blueprint is a public document. SEED_PASSWORD
# is generated by Render; the Stripe keys are added in the dashboard afterwards,
# and the site runs correctly until they are.

databases:
  - name: paltas-db
    databaseName: paltas
    # Not `free`: Render deletes a free database after 30 days, taking every
    # resident, charge and audit entry with it. This is the cheapest plan that
    # persists.
    plan: basic-256mb
    postgresMajorVersion: "16"
    # MUST match the web service's region. Render's internal connection string
    # only resolves within a single region — a service in Frankfurt cannot reach
    # a database in Oregon over the internal hostname, and the failure it
    # produces is exactly `P1001: Can't reach database server at dpg-…:5432`.
    #
    # Omitting this does not inherit the service's region; it silently falls
    # back to Render's default, which is how the two ended up apart.
    region: frankfurt

services:
  - type: web
    name: paltas-platform
    # `next build` peaks around 650 MB on this codebase, measured. Both `free`
    # and `starter` cap at 512 MB, so the build would be killed. `standard` has
    # 2 GB, which clears it with room to spare.
    plan: standard
    region: frankfurt

    # Render builds the Dockerfile itself. No registry is involved, so there is
    # no package to make public and no pull credential to configure — the two
    # things that blocked every previous attempt.
    #
    # The same Dockerfile is built and fully exercised in CI on every push:
    # .github/workflows/image.yml runs the container against a real Postgres and
    # puts all seven end-to-end suites through it. So what Render builds here is
    # an artifact already proven to start, migrate, seed and serve.
    #
    # The build is heavy — around 650 MB locally. Render's build machines are
    # provisioned separately from the instance, so the 512 MB instance limit
    # does not necessarily apply; if a build does fail on memory, the fix is a
    # larger instance, and the GHCR route in DEPLOY.md is the fallback.
    branch: main
    runtime: docker
    dockerfilePath: ./Dockerfile

    # No build or start command: the image carries both. Its CMD applies
    # pending migrations and then serves — see the Dockerfile.
    healthCheckPath: /api/public/listings

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paltas-db
          property: connectionString

      # Supabase Auth: the first two are public browser configuration; the
      # service role key is read only by the server-side provisioning adapter.
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false


      # NEXT_PUBLIC_DATA_SOURCE is gone. It read "mock" on a live deployment
      # serving real listings from the database, which was alarming and untrue:
      # the switch had stopped meaning anything, and setting it to "api" — the
      # obvious response to seeing it — would have pointed the marketplace at
      # an endpoint this app does not serve and broken the homepage. The
      # machinery it guarded has been deleted rather than reconfigured.
      #
      # NEXT_PUBLIC_DEMO_CATALOGUE is deliberately absent. Setting it would put
      # properties that do not exist on a live shopfront that takes money.

      # ---- Stripe -----------------------------------------------------------
      # Deliberately absent from this blueprint so applying it prompts for
      # nothing and cannot stall half-way. Add them in the dashboard, under the
      # service's Environment tab, once live keys have been issued:
      #
      #   STRIPE_SECRET_KEY                   payments 503 without it
      #   NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY  the card form cannot render
      #   STRIPE_WEBHOOK_SECRET               bookings stay PENDING after payment
      #
      # The site runs correctly without all three; only payment does not.

      # ---- Email, and the help assistant ------------------------------------
      # Absent here for the same reason, and added the same way — in the
      # dashboard, on THIS service (paltas-platform). A variable set on the
      # payout cron, or in an environment group that is not linked to this
      # service, is not visible to the web process and the feature stays off
      # with no error anywhere:
      #
      #   RESEND_API_KEY      no email is sent; password reset hands the link
      #                       back in its response instead, deliberately
      #   MAIL_FROM           required alongside it — an address on a domain
      #                       verified with Resend, or every send is refused
      #   MAIL_FLUSH_TOKEN    the outbox retry cron's credential, 32+ chars
      #
      #   ANTHROPIC_API_KEY   the help assistant answers nothing without it,
      #                       and says so rather than appearing broken.
      #                       GET /api/support/chat reports whether the running
      #                       process can see it.
      #   ANTHROPIC_MODEL     optional — change or roll back the model without
      #                       a deploy
      #
      # None of these may be prefixed NEXT_PUBLIC_. That prefix compiles a value
      # into JavaScript served to every visitor, and a key that has been served
      # cannot be recalled.

      # Password for the seeded demo accounts.
      #
      # Generated by Render rather than prompted for, so applying this blueprint
      # asks the operator for nothing at all. Read it from the service's
      # Environment tab to sign in, and change it there whenever you like. The
      # alternative — leaving it unset — falls back to a value published in this
      # repository, on a host anyone can reach.
      #
      # On an empty database the container seeds demo data on first boot, so the
      # site is usable the moment it is live rather than an empty marketplace
      # nobody can sign into. The seed is guarded — it counts users first and
      # does nothing if there are any — so it cannot overwrite real data.
      # Set SKIP_FIRST_BOOT_SEED=true to start genuinely empty instead.
      - key: SEED_PASSWORD
        generateValue: true

      # The credential the payout cron presents. Generated by Render, so it is
      # strong and never written down anywhere a person could paste it. The
      # endpoint refuses the token path entirely unless this is set and long,
      # which means a misconfigured deployment pays nobody rather than paying
      # anybody who asks.
      - key: PAYOUT_RUN_TOKEN
        generateValue: true

      # How long a host's money is held after check-out, and how little is worth
      # a transfer. Stated here so the promise made to guests is visible in the
      # deployment rather than buried in a default.
      - key: PAYOUT_HOLD_DAYS
        value: "1"
      - key: PAYOUT_MINIMUM
        value: "100"

  # ---- Payout scheduler -----------------------------------------------------
  # A cron rather than a timer inside the web service: a web instance may be
  # restarted, scaled or asleep, and money that only moves when a page happens
  # to be served is money that does not move.
  #
  # It holds no ledger logic. It calls one endpoint and reports what happened —
  # every decision about what may be paid lives behind that endpoint, where it
  # is tested. A scheduler that computed payouts itself would be a second
  # implementation of the most expensive code in the repository.
  - type: cron
    name: paltas-payouts
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: frankfurt
    branch: main
    # 06:00 UTC daily: after the night's check-outs, and early enough that a
    # failure is read by a person during the working day rather than at 3am.
    schedule: "0 6 * * *"
    dockerCommand: node scripts/run-payouts.mjs
    envVars:
      - key: PALTAS_URL
        fromService:
          type: web
          name: paltas-platform
          property: hostport
      # The same generated secret the web service holds, copied by Render rather
      # than set twice and left to drift apart.
      - key: PAYOUT_RUN_TOKEN
        fromService:
          type: web
          name: paltas-platform
          envVarKey: PAYOUT_RUN_TOKEN
