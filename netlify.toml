# Netlify configuration for the PALTAS Next.js app.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # Keep the app in mock mode for this test deploy (no backend yet).
  NEXT_PUBLIC_DATA_SOURCE = "mock"

# The official Next.js runtime for Netlify — handles SSR routes, image
# optimization, and per-route rendering. Netlify auto-installs it, and it is
# also pinned in package.json devDependencies for reproducible builds.
[[plugins]]
  package = "@netlify/plugin-nextjs"
