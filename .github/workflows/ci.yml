name: CI

# Auto-deploy is on: every push to main reaches production. This runs the same
# checks first, so a broken commit shows red in GitHub rather than only in
# Render's logs after it is already live.
#
# To make it a gate rather than a warning, turn on "Wait for CI to pass before
# deploying" in the Render service settings.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # No database needed: typecheck, the pure engine tests, and the two structural
  # audits. Fast, so it fails in under a minute when it is going to fail.
  static:
    name: Typecheck, pure tests, structural audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm run test:auth
      - run: npm run audit:routes
      - run: npm run audit:layers
      - run: npm run audit:external

  # The suites that need a real database and a running server.
  integration:
    name: End-to-end against Postgres
    runs-on: ubuntu-latest
    needs: static

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: paltas
          POSTGRES_PASSWORD: paltas
          POSTGRES_DB: paltas
        ports: ["5432:5432"]
        # Without this the steps below can start before Postgres accepts
        # connections, and the failure looks like a bug rather than a race.
        options: >-
          --health-cmd "pg_isready -U paltas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://paltas:paltas@localhost:5432/paltas
      PALTAS_URL: http://localhost:3000
      SEED_PASSWORD: ci-only-not-a-real-password

      # Object storage, declared so that storageEnabled() is true.
      #
      # Not a real bucket, and it does not need to be: no suite here uploads
      # anything. What they need is for the platform to *believe* storage
      # exists, because the identity-document gates disable themselves when it
      # does not — which is right in production, where demanding a document
      # nobody can upload would strand every applicant, and wrong here, where
      # it silently skipped the checks meant to prove the gate works.
      #
      # test:approval failed for ten commits because of exactly that. The gate
      # was never exercised, so approval succeeded where the suite expects a
      # refusal.
      #
      # test:photos is deliberately not run in this job: it asserts the
      # opposite — that unconfigured storage answers 503 — and the two cannot
      # share an environment. See test:all:storage and test:all:nostorage.
      S3_ENDPOINT: https://storage.invalid
      S3_BUCKET: ci-not-a-real-bucket
      S3_ACCESS_KEY_ID: ci-not-a-real-key
      S3_SECRET_ACCESS_KEY: ci-not-a-real-secret
      S3_REGION: auto

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      # Exactly what Render runs, so a build failure surfaces here first.
      - name: Build the way Render does
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npm run build

      - name: Start the production server
        run: |
          npm run start &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/public/listings > /dev/null; then
              echo "up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "server did not start"; exit 1

      - run: npm run test:e2e
      - run: npm run test:platform
      - run: npm run test:commerce
      - run: npm run test:finance
      - run: npm run test:publishing
      - run: npm run test:booking
      - run: npm run test:external
      - run: npm run test:pipeline
      - run: npm run test:enquiry
      - run: npm run test:trip
      - run: npm run test:approval
      # Added this session and never wired in, so nothing was checking them.
      - run: npm run test:messages
      - run: npm run test:notifications

  # A secret reaching the repository is the one failure that cannot be undone by
  # reverting, so it is checked on every push rather than trusted to review.
  secrets:
    name: No credentials committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Scan tracked files for credential patterns
        run: |
          if git ls-files -z | xargs -0 grep -lE \
            'sk_live_[A-Za-z0-9]{20,}|sk_test_[A-Za-z0-9]{20,}|whsec_[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY' \
            2>/dev/null | grep -v '^tests/stripe.test.js$'; then
            echo "::error::A credential-shaped string is committed. Roll the key, then remove it."
            exit 1
          fi
          echo "No credentials found in tracked files."
      - name: .env must never be tracked
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked. It must stay gitignored."
            exit 1
          fi
          echo ".env is not tracked."
