name: Verify the container

# The Dockerfile is built and put through its paces on every push.
#
# It used to push the image to GHCR first and verify it afterwards. That was
# ceremony: render.yaml uses `runtime: docker` and builds from source, so
# nothing ever pulled the published image. The push then started failing with
# `denied: permission_denied: read_package`, and because the verification job
# declared `needs: publish`, a pointless push failure silently stopped the
# container being tested at all.
#
# So the registry is gone. The image is built into the runner's local daemon and
# exercised there. No login, no package permissions, no visibility toggle — a
# whole class of failure removed rather than repaired. If Render is ever pointed
# at a prebuilt image, publishing can come back, and it should come back as its
# own job that verification does not depend on.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-image:
    name: Build the image and test against it
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: paltas
          POSTGRES_PASSWORD: paltas
          POSTGRES_DB: paltas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U paltas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://paltas:paltas@localhost:5432/paltas
      PALTAS_URL: http://localhost:10000
      SEED_PASSWORD: ci-only-not-a-real-password
      IMAGE: paltas-platform:ci

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          # Into the local daemon, not a registry.
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A missing COPY is invisible from outside and produces a bare fs error at
      # boot, which is not enough to act on.
      - name: What is in the image
        run: |
          echo "── files the entrypoint needs"
          docker run --rm --entrypoint sh "$IMAGE" -c '
            for f in server.js package.json prisma/schema.prisma \
                     prisma/first-boot.mjs prisma/seed.mjs \
                     src/lib/security/system-roles.json \
                     node_modules/prisma/build/index.js \
                     node_modules/.prisma/client/index.js \
                     .next/static public; do
              if [ -e "/app/$f" ]; then echo "  present  $f"; else echo "  MISSING  $f"; fi
            done'
          echo "── migrations"
          docker run --rm --entrypoint sh "$IMAGE" -c 'ls /app/prisma/migrations | tail -5'

      - name: Start it exactly as Render does
        run: |
          docker run -d --name paltas \
            --network host \
            -e DATABASE_URL="postgresql://paltas:paltas@localhost:5432/paltas" \
            -e PORT=10000 \
            -e SEED_PASSWORD="$SEED_PASSWORD" \
            "$IMAGE"

          # It migrates and seeds on boot, so allow for that before polling.
          for i in $(seq 1 120); do
            if curl -sf http://localhost:10000/api/public/listings > /dev/null 2>&1; then
              echo "serving after ${i}s"; exit 0
            fi
            # Waiting 120s on a dead container tells us nothing we do not know.
            if [ "$(docker inspect -f '{{.State.Running}}' paltas 2>/dev/null)" != "true" ]; then
              echo "::error::The container exited after ${i}s."
              docker logs paltas 2>&1; exit 1
            fi
            sleep 1
          done
          echo "::error::Running, but never served a request."
          docker logs paltas 2>&1; exit 1

      - name: Did it migrate and seed itself?
        run: |
          docker logs paltas 2>&1 | tail -30
          tables=$(psql "$DATABASE_URL" -tAc \
            "select count(*) from information_schema.tables where table_schema='public'" 2>/dev/null || echo 0)
          echo "tables: $tables"
          if [ "$tables" -lt 40 ]; then
            echo "::error::Migrations did not apply inside the container."; exit 1
          fi
          # first-boot.mjs should have populated an empty database.
          users=$(psql "$DATABASE_URL" -tAc 'select count(*) from "User"' 2>/dev/null || echo 0)
          echo "users after first boot: $users"
          if [ "$users" -lt 1 ]; then
            echo "::error::The container did not seed an empty database."; exit 1
          fi

      - name: Every end-to-end suite, against the running container
        run: |
          npm ci
          npx prisma generate
          node tests/permissions.e2e.mjs
          node tests/platform.e2e.mjs
          node tests/commerce.e2e.mjs
          node tests/finance.e2e.mjs
          node tests/publishing.e2e.mjs
          node tests/booking.e2e.mjs
          node tests/external.e2e.mjs
          node tests/pipeline.e2e.mjs
          node tests/enquiry.e2e.mjs
          node tests/trip.e2e.mjs

      - name: Container logs on failure
        if: failure()
        run: docker logs paltas 2>&1 | tail -100
