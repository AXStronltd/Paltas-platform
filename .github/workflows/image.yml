name: Publish image

# The application is built here rather than on the host.
#
# `next build` peaks around 620-650 MB on this codebase, and a Render free
# instance has 512 MB. Rather than pay for a larger machine to run a build that
# happens once per commit, it runs on a GitHub runner — which has gigabytes —
# and the host receives a finished image.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Provided by Actions; no secret to configure.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag with both the commit and latest
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          # `latest` is what Render follows; the sha tag makes a rollback
          # possible by pointing Render at a specific build.
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache in the registry, so unchanged dependencies are not
          # rebuilt on every commit.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Where it went
        run: |
          echo "Published:"
          echo "  ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest"
          echo ""
          echo "The package is private by default. Make it public once, at"
          echo "  https://github.com/orgs/AXStronltd/packages"
          echo "or give Render a read token, otherwise the pull will 403."
