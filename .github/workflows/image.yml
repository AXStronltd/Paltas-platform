name: Verify the container

# The Dockerfile is built and put through its paces on every push.
#
# It used to push the image to GHCR first and verify it afterwards. That was
# ceremony: render.yaml uses `runtime: docker` and builds from source, so
# nothing ever pulled the published image. The push then started failing with
# `denied: permission_denied: read_package`, and because the verification job
# declared `needs: publish`, a pointless push failure silently stopped the
# container being tested at all.
#
# So the registry is gone. The image is built into the runner's local daemon and
# exercised there. No login, no package permissions, no visibility toggle — a
# whole class of failure removed rather than repaired. If Render is ever pointed
# at a prebuilt image, publishing can come back, and it should come back as its
# own job that verification does not depend on.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-image:
    name: Build the image and test against it
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: paltas
          POSTGRES_PASSWORD: paltas
          POSTGRES_DB: paltas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U paltas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://paltas:paltas@localhost:5432/paltas
      PALTAS_URL: http://localhost:10000
      SEED_PASSWORD: ci-only-not-a-real-password
      IMAGE: paltas-platform:ci

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          # Into the local daemon, not a registry.
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A missing COPY is invisible from outside and produces a bare fs error at
      # boot, which is not enough to act on.
      - name: What is in the image
        run: |
          echo "── files the entrypoint needs"
          docker run --rm --entrypoint sh "$IMAGE" -c '
            for f in server.js package.json prisma/schema.prisma \
                     prisma/first-boot.mjs prisma/seed.mjs \
                     src/lib/security/system-roles.json \
                     node_modules/prisma/build/index.js \
                     node_modules/.prisma/client/index.js \
                     .next/static public; do
              if [ -e "/app/$f" ]; then echo "  present  $f"; else echo "  MISSING  $f"; fi
            done'
          echo "── migrations"
          docker run --rm --entrypoint sh "$IMAGE" -c 'ls /app/prisma/migrations | tail -5'

      # Storage is declared so the identity-document gates are switched on. They
      # disable themselves when it is absent — correct in production, where
      # demanding a document nobody can upload would strand every applicant, and
      # wrong here, where it skips the very checks approval.e2e exists to make.
      # Nothing uploads; the platform only has to believe a bucket is there.
      - name: Start it exactly as Render does
        run: |
          docker run -d --name paltas \
            --network host \
            -e DATABASE_URL="postgresql://paltas:paltas@localhost:5432/paltas" \
            -e PORT=10000 \
            -e SEED_PASSWORD="$SEED_PASSWORD" \
            -e S3_ENDPOINT="https://storage.invalid" \
            -e S3_BUCKET="ci-not-a-real-bucket" \
            -e S3_ACCESS_KEY_ID="ci-not-a-real-key" \
            -e S3_SECRET_ACCESS_KEY="ci-not-a-real-secret" \
            -e S3_REGION="auto" \
            "$IMAGE"

          # It migrates and seeds on boot, so allow for that before polling.
          for i in $(seq 1 120); do
            if curl -sf http://localhost:10000/api/public/listings > /dev/null 2>&1; then
              echo "serving after ${i}s"; exit 0
            fi
            # Waiting 120s on a dead container tells us nothing we do not know.
            if [ "$(docker inspect -f '{{.State.Running}}' paltas 2>/dev/null)" != "true" ]; then
              echo "::error::The container exited after ${i}s."
              docker logs paltas 2>&1; exit 1
            fi
            sleep 1
          done
          echo "::error::Running, but never served a request."
          docker logs paltas 2>&1; exit 1

      - name: Did it migrate and seed itself?
        run: |
          docker logs paltas 2>&1 | tail -30
          tables=$(psql "$DATABASE_URL" -tAc \
            "select count(*) from information_schema.tables where table_schema='public'" 2>/dev/null || echo 0)
          echo "tables: $tables"
          if [ "$tables" -lt 40 ]; then
            echo "::error::Migrations did not apply inside the container."; exit 1
          fi
          # first-boot.mjs should have populated an empty database.
          users=$(psql "$DATABASE_URL" -tAc 'select count(*) from "User"' 2>/dev/null || echo 0)
          echo "users after first boot: $users"
          if [ "$users" -lt 1 ]; then
            echo "::error::The container did not seed an empty database."; exit 1
          fi

      - name: Every end-to-end suite, against the running container
        run: |
          npm ci
          npx prisma generate
          node tests/permissions.e2e.mjs
          node tests/platform.e2e.mjs
          node tests/commerce.e2e.mjs
          node tests/finance.e2e.mjs
          node tests/publishing.e2e.mjs
          node tests/booking.e2e.mjs
          node tests/external.e2e.mjs
          node tests/pipeline.e2e.mjs
          node tests/enquiry.e2e.mjs
          node tests/trip.e2e.mjs
          node tests/approval.e2e.mjs
          node tests/messages.e2e.mjs
          node tests/notifications.e2e.mjs

      - name: Container logs on failure
        if: failure()
        run: docker logs paltas 2>&1 | tail -100

  deploy:
    name: Deploy to Render
    # Only after the container has been built, booted and put through every
    # end-to-end suite. `needs` gives us that half of the gate.
    needs: verify-image
    # Never from a pull request: a fork could otherwise deploy production by
    # opening one.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Wait for CI to pass on this same commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          # The other half of the gate. `needs` cannot reach across workflows, so
          # CI's verdict on THIS commit is read from the API. Typecheck, the unit
          # suites and the committed-credential scan all live there; deploying on
          # the container test alone would skip them.
          echo "Waiting for the CI workflow on ${SHA}..."
          for i in $(seq 1 60); do
            body=$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${REPO}/actions/runs?head_sha=${SHA}&per_page=20") || body=""
            state=$(printf '%s' "$body" | python3 .github/scripts/ci-state.py)
            case "$state" in
              success)
                echo "CI passed."
                exit 0
                ;;
              running|missing|unknown)
                sleep 20
                ;;
              *)
                echo "::error::CI concluded '${state}' for ${SHA}. Not deploying."
                exit 1
                ;;
            esac
          done
          echo "::error::CI did not conclude within 20 minutes. Not deploying."
          exit 1

      - name: Trigger the deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          # Loud, not silent. Render's autoDeploy is off in render.yaml, so a
          # missing secret means nothing reaches paltas.io at all -- and a green
          # pipeline that has quietly stopped deploying is worse than a red one
          # that says why.
          if [ -z "${HOOK}" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL is not set, so this commit cannot deploy."
            echo "Render -> paltas-platform -> Settings -> Deploy Hook -> copy the URL, then"
            echo "GitHub -> Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi
          code=$(curl -s -o /tmp/deploy.out -w '%{http_code}' -X POST "${HOOK}")
          echo "Render answered HTTP ${code}"
          if [ "${code}" -lt 200 ] || [ "${code}" -ge 300 ]; then
            cat /tmp/deploy.out
            exit 1
          fi

      - name: Confirm the commit is actually serving
        env:
          SHA: ${{ github.sha }}
        run: |
          # Triggering a deploy is not the same as deploying. /api/version reports
          # RENDER_GIT_COMMIT, so this waits until paltas.io genuinely serves this
          # commit rather than trusting the hook's 200 and walking away.
          want=$(echo "${SHA}" | cut -c1-7)
          echo "Waiting for paltas.io to serve ${want}..."
          for i in $(seq 1 60); do
            live=$(curl -sf https://paltas.io/api/version | python3 .github/scripts/live-commit.py || echo "")
            if [ "${live}" = "${want}" ]; then
              echo "paltas.io is serving ${want}."
              exit 0
            fi
            echo "  still ${live:-unreachable} (${i}/60)"
            sleep 20
          done
          echo "::error::paltas.io did not reach ${want} within 20 minutes. Check the Render dashboard."
          exit 1
